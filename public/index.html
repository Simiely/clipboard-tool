<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板</title>
<style>
/* ============================================================
   暗黑新拟态 Neumorphism（酒红金版 v2）
   依据《UI迁移手册.md》层0-层4 + dark-design-style-guide「酒红金」配色
   ============================================================ */
:root{
  /* 层0 · 设计令牌（酒红金 · 校准版，对齐 dark-design-style-guide 主页示意 mock：
     中性黑灰底 #1A1A1A/#2F2F2F + 金 #C9A96E 主强调 + 砖红 #AE4D4D 点缀 + 中性文字 #DADADA） */
  --bg:#1A1A1A; --elev:#2F2F2F; --elev-hi:#3A3A3A; --inset:#141414; --border:#3D3D3D;
  --text:#DADADA; --muted:#848484; --dim:#6E6E6E;
  --accent:#C9A96E;          /* 金 · 主强调(按钮/选中/选区/标签 active)，深字配 */
  --accent2:#AE4D4D;         /* 砖红 · 点缀(链接徽章/危险 hover/链接文字 hover)，暖白字配 */
  --green:#9FBF8F;           /* 文本徽章：暖绿（中性底上保持辨识） */
  --amber:#D4AF37;           /* 文件徽章：亮金（与主强调区分） */
  --blue:#AE4D4D;            /* 链接徽章：砖红（对应主题里的"红"点缀，与 mac2 统一） */
  --red:#E08A7A;             /* 危险/错误：暖红高亮（与点缀砖红区分） */
  /* 圆角 */
  --r-md:14px; --r-lg:18px; --r-pill:99px;
  /* 双阴影 tokens（校准版：中性黑灰高光，金棕凸起感由主色承担） */
  --sh-raised:  1px 1px 3px rgba(0,0,0,.5),  -1px -1px 3px rgba(88,88,88,.35);
  --sh-raised-sm:1px 1px 3px rgba(0,0,0,.45), -1px -1px 3px rgba(88,88,88,.3);
  --sh-raised-lg:1px 1px 5px rgba(0,0,0,.52), -1px -1px 5px rgba(88,88,88,.38);
  --sh-inset:  inset 1px 1px 4px rgba(0,0,0,.5),  inset -1px -1px 4px rgba(88,88,88,.32);
  --sh-inset-sm:inset 1px 1px 3px rgba(0,0,0,.45), inset -1px -1px 3px rgba(88,88,88,.28);
  --sh-press:  inset 1px 1px 4px rgba(0,0,0,.52), inset -1px -1px 4px rgba(88,88,88,.35);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
/* 层1 · 输入元素（凹陷内嵌） */
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--inset);border:none;border-radius:12px;padding:9px 12px;outline:none;width:100%;box-shadow:var(--sh-inset-sm);transition:.18s}
input:focus,textarea:focus{box-shadow:var(--sh-inset)}
::selection{background:var(--accent);color:#101014}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* 层1 · 按钮四态 */
.btn{border-radius:12px;padding:8px 15px;font-size:13px;color:var(--muted);background:var(--elev);box-shadow:var(--sh-raised-sm);transition:.16s;white-space:nowrap}
.btn:hover{color:var(--text);background:var(--elev-hi)}
.btn:active{box-shadow:var(--sh-press);transform:translateY(1px)}
.btn.busy,.btn:disabled{opacity:.5;cursor:wait;pointer-events:none}
.btn.primary{background:var(--accent);color:#101014;border:none;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.ghost{box-shadow:none;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--accent2)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:10px}
.btn.danger:hover{color:var(--red)}
.btn.on{color:var(--amber)}

/* 层2 · 容器 */
.view{max-width:960px;margin:0 auto;padding:24px 16px 80px}
.hidden{display:none!important}
.serif{font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",STSong,Georgia,serif}
/* 用户选择页（v0.6.3 · 极简墙：居中品牌 + 紧凑卡片网格 + 底部编辑胶囊） */
.wall{max-width:960px;margin:0 auto;padding:52px 20px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.brand{text-align:center;margin-bottom:44px}
.brand .mark{width:44px;height:44px;margin:0 auto 14px;border-radius:14px;background:var(--inset);box-shadow:var(--sh-inset);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--accent);font-family:"Noto Serif SC","Songti SC",STSong,Georgia,serif}
.brand h1{font-size:clamp(20px,2.6vw,26px);font-weight:500;letter-spacing:.14em}
.brand .sub{margin-top:8px;font-size:12px;color:var(--dim);letter-spacing:.05em}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%}
.user-card{position:relative;padding:22px 14px 18px;text-align:center;cursor:pointer;background:var(--elev);border-radius:var(--r-md);box-shadow:var(--sh-raised);transition:box-shadow .22s var(--ease),background .22s var(--ease)}
.user-card:hover{background:var(--elev-hi);box-shadow:var(--sh-raised-lg),0 0 0 1.5px rgba(201,169,110,.3)}
.user-card:active{box-shadow:var(--sh-inset)}
.user-grid.editing .user-card{box-shadow:var(--sh-raised),0 0 0 1.5px rgba(224,122,122,.5)}
.user-card .del-user-btn{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--inset);box-shadow:var(--sh-inset);color:var(--red);z-index:2;opacity:0;transition:opacity .18s var(--ease)}
.user-grid.editing .user-card .del-user-btn{opacity:1}
.user-card .del-user-btn:hover{background:var(--red);color:#fff}
.user-card .avatar{width:44px;height:44px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;color:#101014;box-shadow:var(--sh-inset)}
.user-card .name{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-card .cnt{color:var(--dim);font-size:11px;margin-top:3px}
.add-user{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:transparent;border:1.5px dashed var(--border);color:var(--dim);border-radius:var(--r-md);min-height:118px;font-size:12px;cursor:pointer;transition:border-color .22s var(--ease),color .22s var(--ease)}
.add-user:hover{border-color:var(--accent);color:var(--accent)}
.add-user .plus{font-size:20px;line-height:1;color:var(--accent)}
.user-actions{margin-top:34px;display:flex;justify-content:center;gap:8px;align-items:center}
.user-actions .btn{border-radius:var(--r-pill);padding:9px 22px;font-size:13px}
.user-actions .btn.ghost.on{color:var(--accent);background:var(--inset);box-shadow:var(--sh-inset)}
.user-foot{margin-top:22px;text-align:center;font-size:11px;color:var(--dim);letter-spacing:.2em}
.empty-state{grid-column:1/-1;text-align:center;padding:40px 0;color:var(--dim);font-size:13px}
/* 主页面 */
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;margin-bottom:14px;flex-wrap:wrap;background:var(--elev);box-shadow:var(--sh-raised);border-radius:var(--r-lg)}
.topbar .t-logo{font-size:22px}
.topbar h1{font-size:18px;font-weight:600;flex:1;min-width:120px}
.topbar .who{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .dot{width:10px;height:10px;border-radius:50%;box-shadow:var(--sh-inset-sm)}
.paste-box{background:var(--elev);box-shadow:var(--sh-raised);border:none;border-radius:var(--r-md);padding:12px;margin-bottom:16px}
.paste-box.drag{box-shadow:var(--sh-raised),0 0 0 1.5px rgba(127,157,255,.6)}
.paste-box textarea{min-height:56px;resize:vertical}
.paste-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.adv-box{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adv-box input,.adv-box select{flex:1;min-width:130px}
/* 主页面工具条（v0.6.4 双行：行1 搜索+存入右置 / 行2 类型+标签+操作） */
.tb{background:var(--elev);border-radius:var(--r-md);box-shadow:var(--sh-raised);padding:12px 14px;margin-bottom:16px}
.tb .row1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tb .row1 .search{flex:1;border:none;outline:none;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset);color:var(--text);padding:10px 20px;font-size:14px;font-family:inherit;transition:box-shadow .18s var(--ease)}
.tb .row1 .search:focus{box-shadow:var(--sh-inset),0 0 0 1.5px rgba(201,169,110,.45)}
.store-btn{flex-shrink:0;border:none;cursor:pointer;font-family:inherit;font-size:13px;padding:10px 22px;border-radius:var(--r-pill);background:var(--accent);color:#101014;font-weight:500;box-shadow:var(--sh-raised);display:flex;align-items:center;gap:7px;transition:all .18s var(--ease)}
.store-btn:hover{background:var(--amber)}
.store-btn:active{box-shadow:var(--sh-inset);transform:translateY(1px)}
.store-btn .plus{font-size:15px;line-height:1}
.tb .row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tb .row2 .typetab{margin-bottom:0}
.tagbar-wrap{flex:1;min-width:140px}
.tb .ops{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-shrink:0;flex-wrap:wrap}
.tb .ops .opt{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);white-space:nowrap}
.tb .ops .opt input[type=checkbox]{width:15px;height:15px;border-radius:4px;appearance:auto;-webkit-appearance:auto;box-shadow:none;margin:0}
.tb .ops .opt input[type=checkbox]::after{display:none}
.tb .ops select{width:auto;padding:6px 10px;font-size:12px;flex-shrink:0}
.tb .ops .btn{padding:6px 13px;font-size:12px;border-radius:var(--r-pill)}
/* 新拟态开关（纯 CSS 伪装 checkbox，不改 JS）：凸起轨道 + 滑块 */
.opt input[type=checkbox]{width:38px;height:22px;border-radius:99px;background:var(--inset);box-shadow:var(--sh-inset-sm);appearance:none;-webkit-appearance:none;position:relative;cursor:pointer;transition:.2s;flex-shrink:0;margin:0}
.opt input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--elev-hi);box-shadow:2px 2px 5px rgba(0,0,0,.5),-1px -1px 3px rgba(44,49,59,.5);transition:.2s}
.opt input[type=checkbox]:checked{background:var(--accent)}
.opt input[type=checkbox]:checked::after{left:19px;background:#EDEDED}
.tagbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tagbar .tag-mgmt-btn{margin-left:auto}
/* 层2 · 类型分段控件（凹陷轨道 + 凸起选中） */
.typetab{display:inline-flex;gap:6px;padding:6px;border-radius:14px;background:var(--inset);box-shadow:var(--sh-inset-sm);flex-wrap:wrap}
.typetab .tt{font-size:13px;padding:6px 18px;border-radius:10px;color:var(--muted);cursor:pointer;transition:.18s}
.typetab .tt:hover{color:var(--text)}
.typetab .tt.on{background:var(--elev);box-shadow:var(--sh-raised-sm);color:var(--accent2);font-weight:600}
.typebadge{font-size:11px;color:var(--dim);padding-left:2px}
.typebadge b{color:var(--accent);font-weight:500}
.cb-hint{display:flex;align-items:center;gap:8px;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--accent2);border:none;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:10px;cursor:pointer}
.cb-hint:hover{box-shadow:var(--sh-inset);color:var(--accent2)}
.paste-modal .paste-box{margin-bottom:0}
.dav-status{font-size:12px;color:var(--muted);margin:6px 0 14px;word-break:break-all}
.dav-hint{font-size:12px;color:var(--dim);margin:4px 0 8px;line-height:1.5}
.dav-opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.dav-opts .opt{display:flex;align-items:center;gap:6px;cursor:pointer}
.dav-opts select{width:auto;padding:6px 10px}
.tag-pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag-pick .tag{cursor:pointer}
.tag-pick input{width:130px;min-width:130px;flex:0 0 auto;padding:6px 10px;font-size:12px;border-radius:var(--r-pill)}
.tag-mgmt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
/* 层1 · 标签 */
.tag{font-size:12px;padding:4px 12px;border-radius:var(--r-pill);background:var(--elev);box-shadow:var(--sh-raised-sm);border:none;color:var(--muted);cursor:pointer;transition:.16s}
.tag:hover{color:var(--accent2)}
.tag.on{background:var(--accent);box-shadow:none;color:#101014;font-weight:600}
.tag.off{opacity:.45}
/* 层3 · 卡片 */
.list{display:grid;gap:16px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.list[data-cols="1"]{grid-template-columns:repeat(1,minmax(0,1fr))}
.list[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.list[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.list[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.clip-card{background:var(--elev);box-shadow:var(--sh-raised);border:none;border-radius:var(--r-lg);padding:14px 16px 12px;cursor:pointer;transition:.2s;position:relative;min-width:0;display:flex;flex-direction:column;gap:8px;height:190px} /* 方案18 统一等高（长内容在内容区内滚动查看，不改变卡高） */
/* 注意：hover/active 不用 transform——卡片内部挂 position:fixed 的图片预览浮层，
   transform 会创建 containing block 使 fixed 相对卡片而非视口，导致浮层定位错乱（bug 修复） */
.clip-card:hover{background:var(--elev-hi);box-shadow:var(--sh-raised-lg),0 0 0 1.5px rgba(201,169,110,.28)}
.clip-card:active{box-shadow:var(--sh-press)}
.clip-card.archived{opacity:.72}
.clip-card.pinned{box-shadow:1px 1px 3px rgba(0,0,0,.5),-1px -1px 3px rgba(88,88,88,.35),0 0 0 1.5px rgba(212,175,55,.65)}
.clip-card.pinned:hover{box-shadow:1px 1px 5px rgba(0,0,0,.52),-1px -1px 5px rgba(88,88,88,.38),0 0 0 1.5px rgba(212,175,55,.65)}
/* 顶部徽章行（固定） */
.clip-card .row1{display:flex;align-items:center;gap:8px;min-height:26px;flex-shrink:0}
.clip-card .title{font-weight:500;font-size:13.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clip-card .status{margin-left:auto;display:flex;gap:5px;flex-shrink:0}
.clip-card .status .st{font-size:10px;padding:2px 8px;border-radius:var(--r-pill);font-weight:500;white-space:nowrap}
.clip-card .status .st.pin{background:rgba(212,175,55,.16);color:var(--amber)}
.clip-card .status .st.exp{background:rgba(174,77,77,.16);color:#D98A8A}
.clip-card .status .st.arch{background:var(--border);color:var(--muted)}
/* 文本内容（v0.6.5：等高 190 内 flex 撑满；内容多时内部滚动查看全文——保留换行，不截断不撑高卡片） */
.clip-card .pv{flex:1;min-height:0;color:var(--muted);font-size:12px;white-space:pre-wrap;word-break:break-word;line-height:1.6;font-family:inherit;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:9px 11px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:transparent transparent}
.clip-card .pv::-webkit-scrollbar{width:4px}
.clip-card .pv::-webkit-scrollbar-thumb{background:transparent;border-radius:2px}
.clip-card:hover .pv{scrollbar-color:var(--border) transparent}
.clip-card:hover .pv::-webkit-scrollbar-thumb{background:var(--border)}
.clip-card .pv::-webkit-scrollbar-thumb:hover{background:var(--dim)}
/* JSON 代码窗 */
.clip-card .code{position:relative;overflow:hidden;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:9px 12px;flex:1;min-height:0}
.clip-card .code .dots{position:absolute;top:8px;left:10px;width:34px;height:8px;background:radial-gradient(circle at 4px 4px,#E08A7A 3px,transparent 3.5px),radial-gradient(circle at 17px 4px,#D4AF37 3px,transparent 3.5px),radial-gradient(circle at 30px 4px,#9FBF8F 3px,transparent 3.5px);opacity:.8}
.clip-card .code .fname{position:absolute;top:5px;left:52px;font-size:10px;color:var(--dim);font-family:ui-monospace,Consolas,monospace}
.clip-card .code pre{margin-top:14px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.6;color:var(--muted);white-space:pre;overflow:hidden;position:relative}
.clip-card .code pre::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(180deg,transparent,var(--inset))}
.clip-card .code pre .k{color:var(--accent)}
.clip-card .code pre .s{color:var(--green)}
/* 链接卡内容：URL + 打开主按钮 */
.clip-card .linkbody{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.clip-card .url{font-size:11.5px;font-family:ui-monospace,Consolas,monospace;color:var(--blue);background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:8px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-card .main-btn{align-self:flex-start;margin-top:auto;border:none;cursor:pointer;font-family:inherit;font-size:11.5px;padding:6px 15px;border-radius:var(--r-pill);background:var(--accent);color:var(--bg);font-weight:500;box-shadow:var(--sh-raised-sm);display:flex;align-items:center;gap:6px;transition:all .16s}
.clip-card .main-btn:hover{background:var(--amber)}
.clip-card .main-btn:active{box-shadow:var(--sh-inset-sm);transform:translateY(1px)}
/* 图片卡内容：cover 撑满 */
.clip-card .imgwrap{min-height:0;background:var(--inset);border-radius:10px;overflow:hidden;position:relative;flex:1}
.clip-card .imgwrap img{width:100%;height:100%;object-fit:cover;display:block}
/* 文件卡内容：图标垂直居中 */
.clip-card .filebody{flex:1;min-height:0;display:flex;align-items:center;gap:14px;padding:2px 0}
.clip-card .fic{width:46px;height:56px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--border)}
.clip-card .fic .fold{position:absolute;top:-1px;left:6px;width:18px;height:5px;background:var(--elev-hi);border-radius:3px 3px 0 0}
.clip-card .fic.pdf{color:#E08A7A;border:1px solid rgba(224,138,122,.35)}
.clip-card .fic.zip{color:var(--accent);border:1px solid rgba(201,169,110,.35)}
.clip-card .fic.pdf::after,.clip-card .fic.zip::after{content:"";position:absolute;inset:4px;border:1px dashed currentColor;border-radius:6px;opacity:.35}
.clip-card .finfo{min-width:0}
.clip-card .finfo .fname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip-card .finfo .fsize{font-size:11px;color:var(--dim);margin-top:3px}
/* 底部 meta 行：信息 + 其余操作（✎ 编辑 / ↓ 下载 / {} JSON） */
.clip-card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:9px;border-top:1px solid var(--border);flex-shrink:0}
.clip-card .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim);flex-wrap:wrap;min-width:0}
.clip-card .foot .ops{margin-left:auto} /* 底部操作组推到最右 */
/* 右上角操作组（v0.6.5：只放 ☆ 置顶 + ✕ 删除；方案18 图标钮） */
.clip-card .ops{display:flex;gap:5px;flex-shrink:0;align-items:center}
/* 方案18 图标按钮：26px 方形、内凹底、常显；hover 金、删除/危险 hover 红 */
.clip-card .ops .b{width:26px;height:26px;border-radius:8px;background:var(--inset);box-shadow:var(--sh-inset-sm);color:var(--muted);border:none;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .14s;line-height:1}
.clip-card .ops .b:hover{color:var(--accent);background:var(--elev-hi)}
.clip-card .ops .b.del:hover{color:var(--red)}
.clip-card .ops .b.on{color:var(--amber)}
/* 富文本左右对比（v0.6.5：左=普通文本 / 右=富文本格式渲染，1:1 双栏，点击各复各的） */
.clip-card .rich-split{display:flex;min-height:0;flex:1;border:1px dashed rgba(201,169,110,.26);border-radius:10px;overflow:hidden;background:var(--inset);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.clip-card .rich-split .half{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 10px;cursor:pointer;transition:background .16s;position:relative}
.clip-card .rich-split .half+.half{border-left:1px dashed rgba(201,169,110,.2)}
.clip-card .rich-split .half:hover{background:rgba(201,169,110,.08)}
.clip-card .rich-split .half:active{background:rgba(201,169,110,.14)}
.clip-card .rich-split .half::after{content:"";position:absolute;inset:0;border-radius:9px;box-shadow:inset 0 0 0 0 rgba(201,169,110,0);transition:box-shadow .16s;pointer-events:none}
.clip-card .rich-split .half:hover::after{box-shadow:inset 0 0 0 1px rgba(201,169,110,.4)}
/* 栏顶小标签：T 纯文本 / ✦ 格式 */
.clip-card .rich-split .lab{font-size:9.5px;color:var(--dim);letter-spacing:.06em;margin-bottom:5px;display:flex;align-items:center;gap:4px;flex-shrink:0}
.clip-card .rich-split .lab b{color:var(--accent);font-weight:500;font-size:10px}
.clip-card .rich-split .lab::after{content:"";flex:1;height:1px;background:var(--border)}
/* 左栏：普通文本（无格式，纯文本样式） */
.clip-card .rich-split .plain-pv{font-size:11.5px;color:var(--muted);line-height:1.6;white-space:pre-wrap;word-break:break-word;flex:1;min-height:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
/* 右栏：富文本（格式渲染：标题加粗/金色强调/列表金点/链接蓝） */
.clip-card .rich-split .rich-pv{font-size:11.5px;color:var(--muted);line-height:1.6;flex:1;min-height:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;white-space:normal}
.clip-card .rich-split .rich-pv h1,.clip-card .rich-split .rich-pv h2,.clip-card .rich-split .rich-pv h3,.clip-card .rich-split .rich-pv h4{font-size:12px;font-weight:600;color:var(--text);margin:0 0 2px;line-height:1.4}
.clip-card .rich-split .rich-pv b,.clip-card .rich-split .rich-pv strong{color:var(--accent);font-weight:600}
.clip-card .rich-split .rich-pv em,.clip-card .rich-split .rich-pv i{color:var(--text);font-style:italic}
.clip-card .rich-split .rich-pv ul{list-style:none;margin:2px 0 0;padding:0}
.clip-card .rich-split .rich-pv li{position:relative;padding-left:12px;margin-top:1px}
.clip-card .rich-split .rich-pv li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:2px;background:var(--accent)}
.clip-card .rich-split .rich-pv a{color:var(--blue);text-decoration:underline;text-decoration-color:rgba(174,77,77,.4);text-underline-offset:2px;word-break:break-all}
/* 图片 hover 预览浮层 */
.img-hover-preview{position:fixed;z-index:98;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);background:var(--elev);box-shadow:var(--sh-raised-lg);border:none;border-radius:14px;padding:10px}
.img-hover-wrap{max-width:100%;max-height:calc(100vh - 70px);overflow:auto;border-radius:10px;background:var(--inset);box-shadow:var(--sh-inset-sm);display:flex;justify-content:center;align-items:flex-start;cursor:grab}
.img-hover-wrap:active{cursor:grabbing}
.img-hover-wrap img{display:block;height:auto;flex-shrink:0;flex-grow:0;user-select:none;-webkit-user-drag:none}
.img-hover-preview .img-cap{font-size:11px;color:var(--dim);text-align:center;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copycnt{color:var(--dim)}
/* 层1 · 徽章 */
.badge{font-size:11px;padding:2px 9px;border-radius:var(--r-pill);background:var(--elev);box-shadow:var(--sh-raised-sm);color:var(--muted)}
.badge.link{color:var(--blue)} .badge.file{color:var(--amber)} .badge.text{color:var(--green)}
.badge.exp{color:var(--red)}
/* 重复内容提示 */
.dup-tip{font-size:12px;color:var(--amber);background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:8px 12px;margin-bottom:4px;line-height:1.5}
.dup-tip-main{font-weight:500}
.dup-tip-sub{color:var(--muted);font-size:11px}
.copied-flash{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--accent);color:#101014;font-weight:600;font-size:13px;padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;box-shadow:var(--sh-raised-lg)}
.copied-flash.at-pos{left:auto;bottom:auto;transform:translate(-50%,-130%)}
.copied-flash.show{opacity:1}
/* 层4 · 弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,12,16,.66);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--elev);box-shadow:var(--sh-raised-lg);border:none;border-radius:var(--r-lg);width:100%;max-width:450px;padding:24px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal .form-row{display:flex;gap:8px;margin-top:14px}
.modal .form-row .btn{flex:1}
.modal .sub{font-size:12px;color:var(--dim);margin-bottom:10px}
/* 密码弹窗（方案22 · 极简聚焦）：下划线输入 + 浮动标签 + 显隐切换 */
.pw-modal{max-width:360px;padding:26px 26px 18px}
.pw-modal .head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pw-modal .head .lock{width:34px;height:34px;border-radius:11px;background:var(--inset);box-shadow:var(--sh-inset-sm);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.pw-modal .head h3{font-size:16px;font-weight:500;margin:0}
.pw-modal .head .who{margin-left:auto;font-size:11px;color:var(--dim);padding:2px 10px;border-radius:var(--r-pill);background:var(--inset);box-shadow:var(--sh-inset-sm);flex-shrink:0}
.pw-modal .sub{font-size:11px;color:var(--dim);margin:0 0 18px 44px}
.pw-modal .field{position:relative;margin-bottom:2px}
.pw-modal .field input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:13px 34px 13px 0;color:var(--text);font-size:13.5px;outline:none;transition:border-color .2s}
.pw-modal .field input::placeholder{color:transparent}
.pw-modal .field input:focus{border-bottom-color:var(--accent)}
.pw-modal .field .pl{position:absolute;left:0;top:13px;font-size:13.5px;color:var(--dim);pointer-events:none;transition:all .18s}
.pw-modal .field input:focus ~ .pl,.pw-modal .field input:not(:placeholder-shown) ~ .pl{top:-7px;font-size:10px;color:var(--accent);letter-spacing:.05em}
.pw-modal .field .eye{position:absolute;right:0;top:50%;transform:translateY(-50%);width:30px;height:30px;border:none;background:transparent;color:var(--dim);font-size:13px;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:color .15s}
.pw-modal .field .eye:hover{color:var(--accent)}
.pw-modal .save{width:100%;margin-top:22px;border:none;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500;padding:12px 0;border-radius:var(--r-pill);background:var(--accent);color:var(--bg);box-shadow:var(--sh-raised-sm);transition:all .16s;letter-spacing:.08em}
.pw-modal .save:hover{background:var(--amber)}
.pw-modal .save:active{box-shadow:var(--sh-inset-sm);transform:translateY(1px)}
.pw-modal .foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}
.pw-modal .foot .hint{font-size:10.5px;color:var(--dim)}
.pw-modal .foot .close{border:none;background:none;color:var(--dim);font-size:11.5px;cursor:pointer;padding:5px 10px;border-radius:var(--r-pill);transition:color .15s}
.pw-modal .foot .close:hover{color:var(--text)}
.tabs{display:flex;gap:6px;margin-bottom:12px;padding:6px;border-radius:14px;background:var(--inset);box-shadow:var(--sh-inset-sm)}
.tab{font-size:13px;padding:6px 14px;border-radius:10px;color:var(--muted);cursor:pointer;transition:.18s}
.tab.on{color:var(--accent2);background:var(--elev);box-shadow:var(--sh-raised-sm);font-weight:600}
.dropzone{border:none;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.18s;background:var(--inset);box-shadow:var(--sh-inset-sm)}
.dropzone:hover{box-shadow:var(--sh-inset);color:var(--accent2)}
.dropzone.drag{box-shadow:var(--sh-inset),0 0 0 1.5px rgba(127,157,255,.6);color:var(--accent2)}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--inset);box-shadow:var(--sh-inset-sm);border-radius:10px;padding:7px 12px;font-size:13px;margin-top:8px;color:var(--text)}
.file-chip .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-mgmt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.empty{text-align:center;color:var(--dim);padding:48px 0;font-size:13px}
.toast-err{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;z-index:99;box-shadow:var(--sh-raised-lg)}
</style>
</head>
<body>
<div class="view" id="view"></div>
<div class="copied-flash" id="flash">已复制</div>
<div id="modal-root"></div>

</body>
</html>

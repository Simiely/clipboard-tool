<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪贴板</title>
<style>
:root{
  --bg:#17121a; --surface:#221b28; --surface2:#2c2333; --border:#3a3042;
  --text:#f2edf4; --muted:#a89ab4; --dim:#7d6f88; --pink:#ff9292; --pink-dim:#b36060;
  --green:#86efac; --amber:#fcd34d; --blue:#7dd3fc; --danger:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:transparent;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,textarea:focus{border-color:var(--pink)}
.btn{border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--pink);color:var(--pink)}
.btn.busy,.btn:disabled{opacity:.5;cursor:wait;pointer-events:none}
.btn.primary{background:var(--pink);color:#24101a;border-color:var(--pink);font-weight:500}
.btn.primary:hover{background:#ffb0b0}
.btn.ghost{color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.view{max-width:720px;margin:0 auto;padding:24px 16px 80px}
.hidden{display:none!important}
/* 用户选择页 */
.hero{text-align:center;padding:48px 0 24px}
.logo{font-size:44px}
.hero h1{font-size:24px;font-weight:600;margin:10px 0 4px}
.hero p{color:var(--muted);font-size:13px}
.user-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:24px}
.user-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;position:relative}
.user-card:hover{border-color:var(--pink);transform:translateY(-2px)}
.user-grid.editing .user-card{border-color:var(--danger)}
.user-card .del-user-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;border:1px solid var(--danger);color:var(--danger);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--surface);z-index:2}
.user-card .del-user-btn:hover{background:var(--danger);color:#fff}
.avatar{width:48px;height:48px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#1c1216}
.user-card .name{font-weight:500;font-size:14px}
.user-card .cnt{color:var(--dim);font-size:12px;margin-top:2px}
.add-user{display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;border:1px dashed var(--border);color:var(--pink);border-radius:14px;padding:18px;font-size:14px;cursor:pointer;transition:.15s}
.add-user:hover{border-color:var(--pink)}
/* 主页面 */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.topbar .t-logo{font-size:22px}
.topbar h1{font-size:18px;font-weight:600;flex:1;min-width:120px}
.topbar .who{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who .dot{width:10px;height:10px;border-radius:50%}
.paste-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:16px}
.paste-box.drag{border-color:var(--pink)}
.paste-box textarea{min-height:56px;resize:vertical}
.paste-row{display:flex;gap:8px;margin-top:10px;align-items:center}
.adv-box{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.adv-box input,.adv-box select{flex:1;min-width:130px}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:140px}
.toolbar select{width:auto;flex-shrink:0;padding:8px 6px}
.tagbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.typetab{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.typetab .tt{font-size:12px;padding:4px 12px;border-radius:99px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:.15s}
.typetab .tt.on{background:var(--pink);border-color:var(--pink);color:#24101a;font-weight:500}
.typebadge{font-size:11px;color:var(--dim);padding-left:2px}
.typebadge b{color:var(--pink);font-weight:500}
.cb-hint{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px dashed var(--pink);color:var(--pink);border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:10px;cursor:pointer}
.cb-hint:hover{border-color:var(--pink);background:var(--surface)}
.paste-trigger{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:10px;margin-bottom:16px;font-size:13px;color:var(--muted);cursor:pointer;transition:.15s}
.paste-trigger:hover{border-color:var(--pink);color:var(--pink)}
.paste-modal .paste-box{margin-bottom:0}
.dav-status{font-size:12px;color:var(--muted);margin:6px 0 14px;word-break:break-all}
.dav-opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.dav-opts .opt{display:flex;align-items:center;gap:4px;cursor:pointer}
.dav-opts select{width:auto;padding:4px 6px}
.tag-pick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag-pick .tag{cursor:pointer}
.tag-pick input{width:130px;min-width:130px;flex:0 0 auto;padding:4px 8px;font-size:12px}
.tag{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:.15s}
.tag.on{background:var(--pink);border-color:var(--pink);color:#24101a;font-weight:500}
.tag.off{opacity:.45}
.list{display:grid;gap:10px;align-items:start;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.list[data-cols="1"]{grid-template-columns:repeat(1,minmax(0,1fr))}
.list[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}
.list[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
.list[data-cols="4"]{grid-template-columns:repeat(4,minmax(0,1fr))}
.clip-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;position:relative;min-width:0}
.clip-card:hover{border-color:var(--pink)}
.clip-card.pinned{border-color:var(--amber)}
.clip-card.pinned:hover{border-color:var(--amber)}
.btn.on{color:var(--amber)}
.clip-card .row1{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.clip-card .title{font-weight:500;font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clip-card .preview{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
/* 图片缩略图（v0.4.0） */
.clip-card .preview.img-thumb{padding:0;margin:6px 0 2px;white-space:normal;text-align:center}
.clip-card .preview.img-thumb img{max-width:100%;max-height:96px;border-radius:8px;object-fit:contain;display:block;margin:0 auto;background:var(--surface2)}
/* 图片 hover 预览浮层（v0.4.2）：框体尺寸由 JS 按图片缩放同步调整（不固定宽度）；
   flex-shrink:0 关键——否则 flex 容器会把 JS 设置的 width 压缩回容器宽度 */
.img-hover-preview{position:fixed;z-index:98;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.img-hover-wrap{max-width:100%;max-height:calc(100vh - 70px);overflow:auto;border-radius:8px;background:var(--surface2);display:flex;justify-content:center;align-items:flex-start;cursor:grab}
.img-hover-wrap:active{cursor:grabbing}
.img-hover-wrap img{display:block;height:auto;flex-shrink:0;flex-grow:0;user-select:none;-webkit-user-drag:none}
.img-hover-preview div{font-size:11px;color:var(--dim);text-align:center;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip-card .meta{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.clip-card .ops{margin-left:auto;display:flex;gap:4px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.badge.link{color:var(--blue)} .badge.file{color:var(--amber)} .badge.text{color:var(--green)}
.badge.exp{color:var(--pink)}
/* 重复内容提示（v0.4.2：编辑页标题下常驻，两行，无边框） */
.dup-tip{font-size:12px;color:var(--amber);background:var(--surface2);border-radius:8px;padding:6px 10px;margin-bottom:4px;line-height:1.5}
.dup-tip-main{font-weight:500}
.dup-tip-sub{color:var(--muted);font-size:11px}
.copied-flash{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:var(--pink);color:#24101a;font-weight:500;font-size:13px;padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
.copied-flash.at-pos{left:auto;bottom:auto;transform:translate(-50%,-130%)}
.copied-flash.show{opacity:1}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:440px;padding:20px;max-height:80vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.modal .form-row{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{font-size:13px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);color:var(--muted)}
.tab.on{color:var(--pink);border-color:var(--pink)}
.dropzone{border:1px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:.15s}
.dropzone.drag{border-color:var(--pink);color:var(--pink)}
.file-chip{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:8px;padding:6px 10px;font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--dim);padding:48px 0;font-size:13px}
.toast-err{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;font-size:13px;padding:8px 16px;border-radius:99px;z-index:99}
</style>
</head>
<body>
<div class="view" id="view"></div>
<div class="copied-flash" id="flash">已复制</div>
<div id="modal-root"></div>

<!-- 前端逻辑（v0.4.0 拆分到独立文件：1251 行单文件超维护甜蜜点，见架构评估报告） -->
<script src="app.js"></script>
</body>
</html>
